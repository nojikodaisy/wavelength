*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque",ui-rounded,"Avenir Next",system-ui,sans-serif;
  font-size:17px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:20px 20px 48px}

/* wordmark: letters riding a wave */
.mark{display:inline-flex;font-weight:800;font-stretch:80%;letter-spacing:-.02em;line-height:1}
.mark span{display:inline-block;transform:translateY(var(--y))}
.mark.big{font-size:clamp(52px,13vw,104px);margin:28px 0 8px}
.mark.small{font-size:22px}
@media (prefers-reduced-motion:no-preference){
  .mark.big span{animation:ride 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*-.32s)}
  @keyframes ride{0%,100%{transform:translateY(calc(var(--a)*-1))}50%{transform:translateY(var(--a))}}
}

.lede{font-size:20px;color:var(--muted);max-width:30ch;margin:0 0 32px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .grow{flex:1}
.code{font-weight:700;font-stretch:85%;padding:4px 12px;border-radius:999px;background:var(--field)}
.link{background:none;border:0;padding:6px 2px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}

.players{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px;padding:0;list-style:none}
.players li{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;border-radius:999px;border:1px solid var(--line);font-size:15px}
.players li .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--c)}
.players li.psy{border-color:var(--accent)}
.players li .tag{font-size:12px;color:var(--accent);font-weight:600}
.players li.me{font-weight:600}

/* stage */
.stage{position:relative;margin-top:10px}
svg.dial{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;outline:none}
svg.dial:focus,svg.dial:focus-visible{outline:none}
.stage{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
svg.dial.grab{cursor:grab}
svg.dial.grab:active{cursor:grabbing}
.ends{display:flex;justify-content:space-between;gap:16px;margin-top:-4px}
.ends div{font-weight:750;font-stretch:78%;font-size:clamp(24px,6vw,40px);line-height:1;max-width:46%;overflow-wrap:anywhere}
.ends div:last-child{text-align:right}
.ends .ghost{color:var(--muted);opacity:.45}
.clue{text-align:center;font-size:clamp(26px,6vw,38px);font-weight:400;font-stretch:90%;margin:18px 0 4px;min-height:1.3em;overflow-wrap:anywhere}
.clue .q{color:var(--accent)}

.wedge-in{transform-box:view-box;transform-origin:200px 214px}
.needle{transform-box:view-box;transform-origin:200px 214px;transition:transform .14s ease-out}
.needle.live{transition:none}
@media (prefers-reduced-motion:no-preference){
  .wedge-in.pop{animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
}

/* panel */
.panel{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.panel p{margin:0 0 14px;max-width:56ch}
.panel .say{font-size:20px}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
.field label{font-size:14px;color:var(--muted)}
.field input{border:0;border-bottom:2px solid var(--line);background:transparent;padding:8px 2px;font-size:20px;outline:none;border-radius:0}
.field input:focus{border-bottom-color:var(--accent)}
.btn{border:0;border-radius:999px;padding:13px 24px;font-weight:650;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:17px}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.quiet{background:var(--field);color:var(--ink)}
:focus-visible{outline:3px solid var(--z2);outline-offset:3px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}

.games{list-style:none;padding:0;margin:8px 0 0}
.games li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.games li .who{flex:1;color:var(--muted);font-size:15px}
.games li strong{color:var(--ink);font-weight:650}
h2{font-size:15px;font-weight:600;color:var(--muted);margin:40px 0 0}

.verdict{display:flex;align-items:baseline;gap:14px;margin-bottom:10px}
.verdict b{font-size:64px;font-weight:800;font-stretch:75%;line-height:1}
.verdict span{font-size:22px}
.score{margin-top:26px;color:var(--muted);font-size:15px}
.score b{color:var(--ink);font-size:20px}
.note{padding:12px 14px;border-radius:12px;background:var(--field);color:var(--muted);font-size:15px;margin-bottom:24px}

.share{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 4px}
.share input{flex:1;min-width:200px;border:0;border-radius:12px;background:var(--field);padding:12px 14px;font-size:15px;color:var(--ink)}
.err{color:var(--accent);font-weight:600}

/* selecteur de palette */
.palette{position:relative}
.palette summary{list-style:none;cursor:pointer;font-size:18px;line-height:1;padding:8px;border-radius:999px;background:var(--field)}
.palette summary::-webkit-details-marker{display:none}
.palette[open] summary{background:var(--accent)}
.palette .swatches{position:absolute;right:0;top:calc(100% + 8px);z-index:5;display:grid;grid-template-columns:repeat(5,28px);gap:10px;padding:10px 12px;border-radius:16px;background:var(--bg);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.14)}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--dot);padding:0;cursor:pointer;flex:none}
.swatch:hover{transform:scale(1.1)}
.swatch.active{border-color:var(--ink);border-width:3px}
.actions .palette .swatches{left:0;right:auto}
.sndbtn{border:0;cursor:pointer;font-size:18px;line-height:1;padding:8px;border-radius:999px;background:var(--field)}
.sndbtn[aria-pressed="true"]{opacity:.6}

.wedgeRot{transform-box:view-box;transform-origin:200px 214px}
@media (prefers-reduced-motion:no-preference){
  .wedgeRot.spin{transition:transform 1.15s cubic-bezier(.22,.9,.26,1)}
}

/* selecteur de langue */
.langsw{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--field)}
.langsw button{border:0;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer;background:none;color:var(--muted)}
.langsw button.active{background:var(--accent);color:var(--accent-ink)}
.langsw.inline{margin-left:10px}
</style>
</head>

/* ---------- dial ---------- */
const CX = 200, CY = 214, R = 186;

  const [x1, y1] = pt(v1, r), [x2, y2] = pt(v2, r);
  return `M${CX} ${CY} L${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`;
}
function dialSVG() {
  let ticks = "";
  for (let v = 0; v <= 100; v += 2.5) {
    const long = v % 25 === 0, [x1, y1] = pt(v, R - (long ? 16 : 8)), [x2, y2] = pt(v, R - 2);
    ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--face-ink)" stroke-opacity="${long ? .5 : .22}" stroke-width="${long ? 2 : 1.2}" stroke-linecap="round"/>`;
  }
  const waves = [52, 92, 132].map(r => `<path d="M${CX - r} ${CY} A${r} ${r} 0 0 1 ${CX + r} ${CY}" fill="none" stroke="var(--rim)" stroke-width="1.5" stroke-dasharray="${r === 92 ? "3 7" : "none"}"/>`).join("");
  const bands = [[-12.5,-7.5,2],[-7.5,-2.5,3],[-2.5,2.5,4],[2.5,7.5,3],[7.5,12.5,2]];
  const wedge = bands.map(([a, b, p]) => `<path d="${sector(50 + a, 50 + b, R - 20)}" fill="var(--z${p})"/>`).join("") +
    bands.map(([a, b, p]) => { const [x, y] = pt(50 + (a + b) / 2, R - 42); return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="800" fill="#1A1C43">${p}</text>`; }).join("");
  return `<svg class="dial" id="dial" viewBox="0 0 400 240" role="img" aria-label="${esc(t("dialAria"))}">
    <path d="${sector(0, 100, R + 10)}" fill="var(--face)"/>
    ${waves}
    <g id="wedgeRot" class="wedgeRot"><g id="wedgeIn" class="wedge-in">${wedge}</g></g>
    ${ticks}
    <g id="needle" class="needle">
      <line x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY - R + 6}" stroke="var(--needle)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="${CX}" cy="${CY - R + 22}" r="9" fill="var(--needle)"/>

/* ---------- spin sound (matches the .wedgeRot.spin CSS duration) ---------- */
const SPIN_S = 1.15;
let actx = null;
document.addEventListener("pointerdown", () => {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  if (actx && actx.state === "suspended") actx.resume().catch(() => {});
}, { once: true });
function playSpinSound() {
  if (!actx || S.muted || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  try {
    const now = actx.currentTime, dur = SPIN_S;
    const master = actx.createGain();
    master.gain.value = .11;
    master.connect(actx.destination);

    // shared short burst used for every click's attack
    const clickBuf = actx.createBuffer(1, Math.ceil(actx.sampleRate * .015), actx.sampleRate);
    const clickData = clickBuf.getChannelData(0);
    for (let i = 0; i < clickData.length; i++) clickData[i] = (Math.random() * 2 - 1) * (1 - i / clickData.length);

    // a decelerating train of low, round clicks - like a wheel's ratchet slowing to a stop
    let t = 0, interval = .032;
    while (t < dur) {
      const when = now + t;
      const click = actx.createBufferSource();
      click.buffer = clickBuf;
      const clickFilter = actx.createBiquadFilter();
      clickFilter.type = "lowpass"; clickFilter.frequency.value = 850;
      const clickGain = actx.createGain();
      clickGain.gain.value = .5;
      click.connect(clickFilter).connect(clickGain).connect(master);
      click.start(when); click.stop(when + .02);

      const thump = actx.createOscillator();
      thump.type = "sine";
      thump.frequency.value = 95;
      const thumpGain = actx.createGain();
      thumpGain.gain.setValueAtTime(.6, when);
      thumpGain.gain.exponentialRampToValueAtTime(.001, when + .07);
      thump.connect(thumpGain).connect(master);
      thump.start(when); thump.stop(when + .08);

      interval *= 1.045;
    }
  } catch {}
}
let lastTickAt = 0;
function playTick() {
  if (!actx || S.muted || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const now = actx.currentTime;
  if (now - lastTickAt < .07) return;
  lastTickAt = now;
  try {
    const osc = actx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(190 + Math.random() * 60, now);
    const gain = actx.createGain();
    gain.gain.setValueAtTime(.07, now);
    gain.gain.exponentialRampToValueAtTime(.001, now + .08);
    osc.connect(gain).connect(actx.destination);

}

/* ---------- phase sounds ---------- */
const PHASE_VOL = .15; // overall loudness of the clue/score sounds
function tone(freq, at, dur, { type = "sine", vol = .2, to = null } = {}) {
  const osc = actx.createOscillator();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, at);
  if (to) osc.frequency.exponentialRampToValueAtTime(to, at + dur);
  const gain = actx.createGain();
  gain.gain.setValueAtTime(.0001, at);
  gain.gain.exponentialRampToValueAtTime(vol * PHASE_VOL, at + .015);
  gain.gain.exponentialRampToValueAtTime(.0001, at + dur);

}

function playScoreSound(pts) {
  if (!actx || S.muted) return;
  try {
    const now = actx.currentTime;
    if (pts === 4) {
      [523, 659, 784, 1047].forEach((f, i) => tone(f, now + i * .09, .45, { type: "triangle", vol: .2 }));

/* ---------- game rules (run by the host) ---------- */
const freshGame = () => ({ phase: "lobby", round: 0, order: [], psychic: null, left: "", right: "", target: null, clue: "", guess: null, pts: null, score: 0, played: 0 });
function nextPsychic(g, present, after) {
  const order = g.order.filter(p => present.has(p));
  if (!order.length) return null;
  return order[(order.indexOf(after) + 1) % order.length];
}
function clearRound(g) { g.left = ""; g.right = ""; g.target = null; g.clue = ""; g.guess = null; g.pts = null; }
function apply(g, pid, a, present) {
  if (!a || typeof a !== "object") return;
  const str = (s, n) => String(s ?? "").trim().slice(0, n);
  switch (a.type) {
    case "start":
      if (g.phase === "lobby" && present.size >= 2) { g.round = 1; g.psychic = g.order.find(p => present.has(p)); clearRound(g); g.phase = "theme"; }
      break;
    case "theme":
      if (g.phase === "theme" && pid === g.psychic && a.round === g.round && str(a.left, 40) && str(a.right, 40)) {
        g.left = str(a.left, 40); g.right = str(a.right, 40);
        g.lastLeft = g.left; g.lastRight = g.right; // kept across rounds so the next psychic can reuse it
        g.target = Math.round((12.5 + Math.random() * 75) * 10) / 10; g.phase = "clue";
      }
      break;
    case "back":
      if (g.phase === "clue" && pid === g.psychic && a.round === g.round) { g.phase = "theme"; g.target = null; }
      break;
    case "clue":
      if (g.phase === "clue" && pid === g.psychic && a.round === g.round && str(a.clue, 80)) { g.clue = str(a.clue, 80); g.phase = "guess"; }
      break;
    case "lock":
      if (g.phase === "guess" && pid !== g.psychic && a.round === g.round) {
        g.guess = Math.round(clamp(S.dial) * 10) / 10; g.pts = scoreOf(g.target, g.guess);
        g.score += g.pts; g.played += 1; g.phase = "reveal";
      }
      break;
    case "next":
      if (g.phase === "reveal" && a.round === g.round) {
        g.psychic = nextPsychic(g, present, g.psychic); g.round += 1; clearRound(g); g.phase = "theme";
      }
      break;
  }
}

/* ---------- host ---------- */
const present = () => new Set([...S.roster.values()].filter(p => p.online).map(p => p.pid));
function hostUpdate() {
  const g = S.g, pr = present();
  for (const p of [...S.roster.values()].sort((a, b) => a.joinedAt - b.joinedAt)) if (!g.order.includes(p.pid)) g.order.push(p.pid);
  if (["theme", "clue", "guess"].includes(g.phase) && !pr.has(g.psychic)) {
    g.psychic = nextPsychic(g, pr, g.psychic); clearRound(g); g.phase = "theme";
  }
  if (g.round !== S.dialRound) { S.dialRound = g.round; S.dial = 50; S.dialBy = null; }
  S.players = [...S.roster.values()].sort((a, b) => a.joinedAt - b.joinedAt).map(p => ({ pid: p.pid, name: p.name, online: p.online }));
  broadcast();
  store.set("wl-host", JSON.stringify({ code: S.code, g: S.g, roster: S.players }), true);
  render();
}
function broadcast() {
  const msg = { t: "state", g: S.g, players: S.players, dial: S.dial, dialBy: S.dialBy };
  for (const p of S.roster.values()) if (p.online && p.conn && p.conn.open) { try { p.conn.send(msg); } catch {} }
}
function hostOnData(conn, d) {

    const prev = S.roster.get(d.pid);
    if (prev && prev.conn && prev.conn !== conn) { try { prev.conn.close(); } catch {} }
    conn._pid = d.pid;
    S.roster.set(d.pid, { pid: d.pid, name: String(d.name || t("defaultPlayer")).trim().slice(0, 24) || t("defaultPlayer"), online: true, joinedAt: prev ? prev.joinedAt : Date.now(), conn });
    hostUpdate();
  } else if (!conn._pid) {
    return;
  } else if (d.t === "act") {
    apply(S.g, conn._pid, d.a, present()); hostUpdate();
  } else if (d.t === "dial" && typeof d.v === "number" && S.g.phase === "guess" && conn._pid !== S.g.psychic && d.r === S.g.round) {
    S.dial = clamp(d.v); S.dialBy = (S.roster.get(conn._pid) || {}).name || null;
    broadcast(); drawDial(); updateLive();
  }
}
function startHost(code, saved, attempt = 0) {

  peer.on("open", () => {
    S.isHost = true; S.code = code;
    S.g = saved ? saved.g : freshGame();
    S.roster = new Map();
    if (saved) for (const p of saved.roster || []) S.roster.set(p.pid, { pid: p.pid, name: p.name, online: false, joinedAt: Date.now() });
    S.roster.set(S.pid, { pid: S.pid, name: S.name, online: true, joinedAt: (S.roster.get(S.pid) || {}).joinedAt || Date.now() - 1e6 });
    history.replaceState(null, "", "#" + code);
    S.view = "game"; S.panelKey = ""; hostUpdate();
  });
  peer.on("connection", conn => {
    conn.on("data", d => hostOnData(conn, d));
    conn.on("close", () => {
      const p = conn._pid && S.roster.get(conn._pid);
      if (p && p.conn === conn) { p.online = false; p.conn = null; hostUpdate(); }
    });
  });
  peer.on("error", err => {
    if (err.type === "unavailable-id") {
      peer.destroy();
      if (saved && attempt < 6) setTimeout(() => startHost(code, saved, attempt + 1), 2500);
      else if (!saved) startHost("wl-" + rid(5), null);
      else fail(t("errHostRecover"));
    } else if (["network", "server-error", "socket-error", "socket-closed"].includes(err.type)) {
      fail(t("errNetwork"));
    }
  });
  peer.on("disconnected", () => { if (!peer.destroyed) peer.reconnect(); });
}

/* ---------- client ---------- */
function startClient(code) {
  S.view = "connecting"; S.error = ""; render();
  const peer = new Peer({ debug: 0 });
  S.peer = peer;
  const timer = setTimeout(() => { if (S.view === "connecting") fail(t("errNoResponse")); }, 15000);
  peer.on("open", () => {
    const conn = peer.connect(PREFIX + code, { reliable: true });
    S.hostConn = conn;
    conn.on("open", () => conn.send({ t: "hello", pid: S.pid, name: S.name }));
    conn.on("data", d => {
      if (!d || d.t !== "state" || !d.g) return;
      clearTimeout(timer);
      if (S.view !== "game") { S.view = "game"; S.code = code; S.panelKey = ""; }
      S.g = d.g; S.players = Array.isArray(d.players) ? d.players : [];
      if (S.g.round !== S.dialRound) { S.dialRound = S.g.round; S.dial = 50; S.dialBy = null; }
      if (!S.dragging) { S.dial = clamp(+d.dial || 50); S.dialBy = d.dialBy || null; }
      render();
    });
    conn.on("close", () => { if (S.hostConn === conn && S.view === "game") fail(t("errHostLeft")); });
  });
  peer.on("error", err => {
    if (err.type === "peer-unavailable") fail(t("errNotFound"));
    else if (["network", "server-error", "socket-error"].includes(err.type)) fail(t("errNetwork"));
  });
}

function fail(msg) {
  try { S.peer && S.peer.destroy(); } catch {}
  S.peer = null; S.hostConn = null; S.isHost = false; S.g = null; onlineSeen = null; soundKey = null;
  S.view = "home"; S.error = msg; render();
}
function leave() {
  try { S.peer && S.peer.destroy(); } catch {}
  store.del("wl-host", true);
  S.peer = null; S.hostConn = null; S.isHost = false; S.g = null; S.code = null; S.error = ""; onlineSeen = null; soundKey = null;
  history.replaceState(null, "", location.pathname + location.search);
  S.view = "home"; render();
}
function act(type, data = {}) {
  const a = { type, ...data };
  if (S.isHost) { apply(S.g, S.pid, a, present()); hostUpdate(); }
  else if (S.hostConn && S.hostConn.open) S.hostConn.send({ t: "act", a });
}
let dialQueued = false;
function sendDial() {
  if (S.isHost) { broadcast(); return; }
  if (dialQueued) return;
  dialQueued = true;
  requestAnimationFrame(() => { dialQueued = false; if (S.hostConn && S.hostConn.open) S.hostConn.send({ t: "dial", v: S.dial, r: S.g.round }); });
}

/* ---------- rendering ---------- */
const nameOf = pid => (S.players.find(p => p.pid === pid) || {}).name || t("someone");
const colorOf = pid => COLORS[[...pid].reduce((s, c) => s + c.charCodeAt(0), 0) % COLORS.length];

function readName() {
  const n = $("#nick"); S.name = (n && n.value.trim().slice(0, 24)) || S.name || t("defaultPlayer");
  store.set("wl-name", S.name);
}
function renderHome() {
  const invite = hashCode();
  $("#app").innerHTML = `
    ${mark("big")}
    <p class="lede">${t("lede")}</p>
    ${S.error ? `<div class="note err">${esc(S.error)}</div>` : ""}
    ${invite ? `<p class="say">${t("invitedIn")} <span class="code">${esc(invite)}</span></p>` : ""}
    <div class="row">
      <div class="field"><label for="nick">${t("nick")}</label><input id="nick" maxlength="24" autocomplete="nickname" value="${esc(S.name)}" placeholder="${esc(t("nickPh"))}"></div>
      <button class="btn" id="go">${invite ? t("join") : t("create")}</button>
    </div>
    ${invite ? `<div class="actions"><button class="link" id="own">${t("ownGame")}</button></div>` : ""}
    ${typeof Peer === "undefined" ? `<div class="note err" style="margin-top:20px">${t("peerFail")}</div>` : ""}
    <div class="actions" style="margin-top:28px">
      <details class="palette"><summary title="${esc(t("themeTitle"))}">🎨</summary><div class="swatches">${paletteSwatchesHTML()}</div></details>
      ${soundBtnHTML()}
      ${langSwitchHTML("inline")}
    </div>
  `;
  const go = () => {
    readName();
    if (typeof Peer === "undefined") return;
    if (invite) startClient(invite); else startHost("wl-" + rid(5), null);
  };
  $("#go").onclick = go;
  $("#nick").onkeydown = e => { if (e.key === "Enter") go(); };
  if ($("#own")) $("#own").onclick = () => { readName(); history.replaceState(null, "", location.pathname + location.search); startHost("wl-" + rid(5), null); };
  bindPaletteSwatches($("#app"));
  bindSoundBtn($("#app"));
  bindLangSwitch($("#app"));
}

function ensureGameShell() {
  if ($("#dial")) return;
  $("#app").innerHTML = `
    <div class="top">${mark("small")}<span class="grow"></span>
      ${langSwitchHTML()}
      <details class="palette" id="paletteBtn"><summary title="${esc(t("themeTitle"))}">🎨</summary><div class="swatches">${paletteSwatchesHTML()}</div></details>
      ${soundBtnHTML()}
      <span class="code" id="code"></span><button class="link" id="leave">${t("leave")}</button></div>
    <ul class="players" id="players"></ul>
    <section class="stage">${dialSVG()}
      <div class="ends"><div id="endL"></div><div id="endR"></div></div>
      <div class="clue" id="clue"></div>
    </section>
    <section class="panel" id="panel" aria-live="polite"></section>
    <div class="score" id="score"></div>`;
  $("#leave").onclick = () => { if (!S.isHost || confirm(t("leaveConfirm"))) leave(); };
  bindPaletteSwatches($("#paletteBtn"));
  bindSoundBtn($("#app"));
  bindLangSwitch($("#app"));
  bindDrag();
}

function canDrag() { return S.g && S.g.phase === "guess" && S.g.psychic !== S.pid; }
function bindDrag() {
  const svg = $("#dial");
  const valueAt = e => {
    const r = svg.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * 400, y = (e.clientY - r.top) / r.height * 240;
    let a = Math.atan2(CY - y, x - CX) * 180 / Math.PI;
    if (a < 0) a = x < CX ? 180 : 0;
    return clamp((180 - a) / 1.8);
  };
  const set = v => { S.dial = Math.round(v * 10) / 10; S.dialBy = S.name; sendDial(); drawDial(); updateLive(); };
  svg.addEventListener("pointerdown", e => { if (!canDrag()) return; e.preventDefault(); S.dragging = true; svg.setPointerCapture(e.pointerId); set(valueAt(e)); });
  svg.addEventListener("pointermove", e => { if (S.dragging) set(valueAt(e)); });
  const end = () => { S.dragging = false; drawDial(); };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);
  svg.setAttribute("tabindex", "0");
  svg.addEventListener("keydown", e => {
    if (!canDrag() || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
    e.preventDefault();
    const step = e.shiftKey ? 5 : 1;
    set(clamp(S.dial + (e.key === "ArrowLeft" ? -step : step)));
  });
}

let lastTickVal = null;
function drawDial() {
  const g = S.g; if (!g || !$("#dial")) return;
  const amPsy = g.psychic === S.pid;
  const v = g.phase === "reveal" ? g.guess : g.phase === "guess" ? S.dial : 50;
  if (g.phase === "guess") {
    if (lastTickVal !== null && lastTickVal !== v) playTick();
    lastTickVal = v;
  } else lastTickVal = null;
  const needle = $("#needle");
  needle.style.transform = `rotate(${((v - 50) * 1.8).toFixed(2)}deg)`;
  needle.classList.toggle("live", S.dragging);
  needle.style.opacity = ["guess", "reveal"].includes(g.phase) ? 1 : .35;
  $("#dial").classList.toggle("grab", canDrag());
  const showWedge = g.target != null && (g.phase === "reveal" || (amPsy && ["clue", "guess"].includes(g.phase)));
  const rot = $("#wedgeRot"), win = $("#wedgeIn");
  const targetDeg = ((g.target ?? 50) - 50) * 1.8;
  const spunKey = `${g.round}:${g.target}`;
  if (showWedge && amPsy && g.phase === "clue" && S.spunKey !== spunKey) {
    S.spunKey = spunKey;
    playSpinSound();
    rot.classList.remove("spin");
    rot.style.transform = `rotate(${(targetDeg - 1080).toFixed(2)}deg)`;
    void rot.getBBox();
    rot.classList.add("spin");
    requestAnimationFrame(() => requestAnimationFrame(() => { rot.style.transform = `rotate(${targetDeg.toFixed(2)}deg)`; }));
    rot.addEventListener("transitionend", () => rot.classList.remove("spin"), { once: true });
  } else if (!rot.classList.contains("spin")) {
    rot.style.transform = `rotate(${targetDeg.toFixed(2)}deg)`;
  }
  rot.style.display = showWedge ? "" : "none";
  rot.style.opacity = amPsy && g.phase === "guess" ? .45 : 1;
  if (g.phase === "reveal" && S.revealedRound !== g.round) {
    S.revealedRound = g.round; win.classList.remove("pop"); void win.getBBox(); win.classList.add("pop");
  } else if (g.phase !== "reveal") win.classList.remove("pop");
}

function renderGame() {
  ensureGameShell();
  const g = S.g, ps = S.players;
  $("#code").textContent = S.code;
  $("#leave").textContent = t("leave");
  $("#dial").setAttribute("aria-label", t("dialAria"));
  const paletteSummary = $("#paletteBtn summary"); if (paletteSummary) paletteSummary.title = t("themeTitle");
  for (const b of $$(".top .langsw button")) b.classList.toggle("active", b.dataset.lang === S.lang);
  for (const b of $$(".top .sndbtn")) b.title = t(S.muted ? "soundOn" : "soundOff");
  $("#players").innerHTML = ps.map(p => `<li class="${p.pid === g.psychic ? "psy" : ""} ${p.pid === S.pid ? "me" : ""}" style="${p.online ? "" : "opacity:.4"}">
      <span class="dot" style="--c:${colorOf(p.pid)}">${esc((p.name[0] || "?").toUpperCase())}</span>${esc(p.name)}${p.pid === S.pid ? esc(t("you")) : ""}${p.online ? "" : esc(t("gone"))}${p.pid === g.psychic ? `<span class="tag">${esc(t("medium"))}</span>` : ""}</li>`).join("");
  const amPsy = g.psychic === S.pid, psyName = nameOf(g.psychic);
  if (g.left && g.right) { S.lastL = g.left; S.lastR = g.right; } // remembered so the next psychic can keep the same spectrum
  const themeKey = `${g.round}:${g.psychic}`;
  if (g.phase === "theme" && amPsy && S.themeKey !== themeKey) { S.themeKey = themeKey; S.draftL = g.lastLeft || S.lastL || ""; S.draftR = g.lastRight || S.lastR || ""; }
  const typingTheme = g.phase === "theme" && amPsy;
  const L = typingTheme ? S.draftL : g.left, Rr = typingTheme ? S.draftR : g.right;
  $("#endL").innerHTML = L ? esc(L) : `<span class="ghost">${esc(t("left"))}</span>`;
  $("#endR").innerHTML = Rr ? esc(Rr) : `<span class="ghost">${esc(t("right"))}</span>`;
  $("#clue").innerHTML = g.clue ? `<span class="q">${t("quoteOpen")}</span> ${esc(g.clue)} <span class="q">${t("quoteClose")}</span>` : "";
  $("#score").innerHTML = g.played ? `<b>${g.score}</b> ${t("score", g.played)}` : "";
  drawDial();
  phaseSounds(g);
  joinSounds(ps);

  const online = ps.filter(p => p.online).length;
  const key = [g.phase, g.round, g.psychic, amPsy, online >= 2, S.lang].join("|");
  const panel = $("#panel");
  if (key === S.panelKey) { updateLive(); return; }
  S.panelKey = key;

  if (g.phase === "lobby") {
    const enough = online >= 2;
    panel.innerHTML = `
      ${S.isHost ? `<p class="say">${t("shareSay")}</p>
      <div class="share"><input id="link" readonly value="${esc(shareLink())}" aria-label="${esc(t("linkLabel"))}"><button class="btn quiet" id="copy">${t("copyLink")}</button></div>
      <p class="muted">${t("hostKeepOpen")}</p>`
      : `<p class="say">${t("waitSay")}</p>`}
      <div class="actions"><button class="btn" id="start" ${enough ? "" : "disabled"}>${t("startGame")}</button>
      ${enough ? "" : `<span class="muted">${t("needTwo")}</span>`}</div>`;
    $("#start").onclick = () => act("start");
    if ($("#copy")) $("#copy").onclick = async () => {
      const b = $("#copy");
      try { await navigator.clipboard.writeText(shareLink()); } catch { $("#link").select(); document.execCommand && document.execCommand("copy"); }
      b.textContent = t("copied"); setTimeout(() => { if (b.isConnected) b.textContent = t("copyLink"); }, 1800);
    };
  } else if (g.phase === "theme") {
    if (amPsy) {
      panel.innerHTML = `
        <p class="say">${t("youAreMedium")}</p>
        <div class="row">
          <div class="field"><label for="inL">${t("leftLabel")}</label><input id="inL" maxlength="40" value="${esc(S.draftL)}" placeholder="${esc(t("leftPh"))}"></div>
          <div class="field"><label for="inR">${t("rightLabel")}</label><input id="inR" maxlength="40" value="${esc(S.draftR)}" placeholder="${esc(t("rightPh"))}"></div>
        </div>
        <div class="actions"><button class="btn" id="okTheme">${t("validateTheme")}</button><button class="btn quiet" id="rnd">${t("randomIdea")}</button></div>`;
      const sync = () => { S.draftL = $("#inL").value; S.draftR = $("#inR").value;
        $("#endL").innerHTML = S.draftL ? esc(S.draftL) : `<span class="ghost">${esc(t("left"))}</span>`;
        $("#endR").innerHTML = S.draftR ? esc(S.draftR) : `<span class="ghost">${esc(t("right"))}</span>`;
        $("#okTheme").disabled = !(S.draftL.trim() && S.draftR.trim()); };
      $("#inL").oninput = sync; $("#inR").oninput = sync;
      $("#rnd").onclick = () => { const list = SPECTRES[S.lang]; const [a, b] = list[Math.floor(Math.random() * list.length)]; $("#inL").value = a; $("#inR").value = b; sync(); };
      $("#okTheme").onclick = () => act("theme", { round: g.round, left: S.draftL, right: S.draftR });
      sync(); $("#inL").focus();
    } else {
      panel.innerHTML = `<p class="say">${t("psyIs", esc(psyName))}</p>
        <p class="muted">${t("agreeSpectrum", esc(psyName))}</p>`;
    }
  } else if (g.phase === "clue") {
    if (amPsy) {
      panel.innerHTML = `
        <p class="say">${t("clueSay", esc(g.left), esc(g.right))}</p>
        <div class="row"><div class="field"><label for="inClue">${t("clueLabel")}</label><input id="inClue" maxlength="80" placeholder="${esc(t("cluePh"))}"></div>
        <button class="btn" id="okClue" disabled>${t("sendClue")}</button></div>
        <div class="actions"><button class="link" id="back">${t("backTheme")}</button></div>`;
      $("#inClue").oninput = e => $("#okClue").disabled = !e.target.value.trim();
      $("#inClue").onkeydown = e => { if (e.key === "Enter" && e.target.value.trim()) $("#okClue").click(); };
      $("#okClue").onclick = () => act("clue", { round: g.round, clue: $("#inClue").value });
      $("#back").onclick = () => { S.draftL = g.left; S.draftR = g.right; act("back", { round: g.round }); };
      $("#inClue").focus();
    } else {
      panel.innerHTML = `<p class="say">${t("psySearching", esc(psyName))}</p><p class="muted">${t("noCheat")}</p>`;
    }
  } else if (g.phase === "guess") {
    if (amPsy) {
      panel.innerHTML = `<p class="say">${t("psyWatch")}</p><p class="muted" id="by"></p>`;
    } else {
      panel.innerHTML = `<p class="say">${t("turnTogether")}</p>
        <p class="muted" id="by"></p>
        <div class="actions"><button class="btn" id="lock">${t("lockBtn")}</button></div>`;
      $("#lock").onclick = () => act("lock", { round: g.round });
    }
    updateLive();
  } else if (g.phase === "reveal") {
    const next = nameOf(nextPsychic(g, new Set(ps.filter(p => p.online).map(p => p.pid)), g.psychic));
    panel.innerHTML = `
      <div class="verdict"><b>+${g.pts}</b><span>${t("verdict")[g.pts]}</span></div>
      <p class="muted">${t("nextPsy", esc(next))}</p>
      <div class="actions"><button class="btn" id="next">${t("nextRound")}</button></div>`;
    $("#next").onclick = () => act("next", { round: g.round });
  }
}
function updateLive() {
  const by = $("#by"); if (!by) return;
  by.textContent = S.dialBy
    ? (S.dialBy === S.name ? t("byYou") : t("byOther", S.dialBy))
    : (S.g && S.g.psychic === S.pid ? t("byNoneSelf") : t("byNoneOther"));
}

function render() {
  if (S.view === "game" && S.g) return renderGame();
  if (S.view === "connecting") { $("#app").innerHTML = `${mark("big")}<p class="lede">${t("connecting")}</p>`; return; }
  renderHome();
}

/* ---------- boot ---------- */
document.documentElement.lang = S.lang;
(() => {
  let saved = null;
  try { saved = JSON.parse(store.get("wl-host", true) || "null"); } catch {}
  const h = hashCode();
  if (saved && h && saved.code === h && saved.g && typeof Peer !== "undefined") startHost(h, saved);
  else render();
})();
window.addEventListener("hashchange", () => { if (S.view === "home") render(); });
})();
</script>
</body>
</html>
